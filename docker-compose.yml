version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: day7/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_MODEL=${GROQ_MODEL:-openai/gpt-oss-120b}
    volumes:
      - ../day2/data:/app/day2/data
      - ../day4/data:/app/day4/data
      - ../day5/data:/app/day5/data
    restart: unless-stopped